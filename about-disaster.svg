<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="disasterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="disasterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="16" fill="url(#disasterBg)" />
  <circle cx="200" cy="140" r="85" fill="#fde68a" opacity="0.6" />

  <!-- Shelter / House Protection -->
  <g transform="translate(135, 70)">
    <!-- Protective Umbrella/Roof -->
    <path d="M 65 10 L 130 65 L 115 65 L 65 25 L 15 65 L 0 65 Z" fill="url(#disasterGrad)" />
    <!-- House Body -->
    <rect x="25" y="60" width="80" height="70" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="3" />
    <!-- Door -->
    <rect x="52" y="85" width="26" height="45" rx="3" fill="#0d9488" />
    <!-- Heart in the house -->
    <path d="M 65 72 C 65 72 62 66 58 68 C 54 70 55 74 58 77 L 65 82 L 72 77 C 75 74 76 70 72 68 C 68 66 65 72 65 72 Z" fill="#ef4444" />
  </g>

  <!-- Supporting protective hands -->
  <path d="M 120 200 C 120 200, 160 225, 200 225 C 240 225, 280 200, 280 200" fill="none" stroke="#0d9488" stroke-width="6" stroke-linecap="round" />
  <circle cx="80" cy="90" r="14" fill="#fcd34d" opacity="0.5" />
  <circle cx="320" cy="80" r="18" fill="#fbbf24" opacity="0.4" />
</svg>
