<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="heroTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="heroAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="heroGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccfbf1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0.3" />
    </linearGradient>
    <filter id="heroShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0f766e" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background decorative glows & curves -->
  <circle cx="300" cy="225" r="180" fill="url(#heroGlow)" filter="blur(20px)" />
  <circle cx="480" cy="100" r="50" fill="#a7f3d0" opacity="0.4" />
  <circle cx="100" cy="350" r="70" fill="#fde68a" opacity="0.4" />

  <!-- Main Central Financial Transparency Dashboard Mockup -->
  <rect x="110" y="70" width="380" height="270" rx="20" fill="#ffffff" filter="url(#heroShadow)" stroke="#e2e8f0" stroke-width="2" />

  <!-- Dashboard Top Bar -->
  <rect x="110" y="70" width="380" height="48" rx="20" fill="url(#heroTeal)" />
  <rect x="110" y="100" width="380" height="18" fill="url(#heroTeal)" />
  <circle cx="135" cy="94" r="5" fill="#f87171" />
  <circle cx="150" cy="94" r="5" fill="#fbbf24" />
  <circle cx="165" cy="94" r="5" fill="#4ade80" />
  <text x="300" y="99" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">NGO Fund Allocation Tracker</text>

  <!-- Metric Mini Cards inside Dashboard -->
  <g transform="translate(130, 130)">
    <rect width="100" height="55" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5" />
    <text x="10" y="20" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#0f766e">TOTAL RAISED</text>
    <text x="10" y="42" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#0d9488">$1.48M</text>
  </g>

  <g transform="translate(245, 130)">
    <rect width="100" height="55" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" />
    <text x="10" y="20" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#b45309">DISBURSED</text>
    <text x="10" y="42" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#d97706">$1.12M</text>
  </g>

  <g transform="translate(360, 130)">
    <rect width="110" height="55" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
    <text x="10" y="20" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#15803d">ACTIVE CAUSES</text>
    <text x="10" y="42" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#16a34a">28 Projects</text>
  </g>

  <!-- Chart Graphic Area -->
  <g transform="translate(130, 200)">
    <rect width="340" height="115" rx="10" fill="#f8fafc" stroke="#f1f5f9" />
    <!-- Grid lines -->
    <line x1="20" y1="90" x2="320" y2="90" stroke="#e2e8f0" stroke-width="1" />
    <line x1="20" y1="55" x2="320" y2="55" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="20" y1="20" x2="320" y2="20" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Inflow Area & Line -->
    <path d="M 30 75 Q 80 50, 130 65 T 210 30 T 270 40 T 310 15" fill="none" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="130" cy="65" r="4" fill="#0d9488" stroke="#ffffff" stroke-width="2" />
    <circle cx="210" cy="30" r="4" fill="#0d9488" stroke="#ffffff" stroke-width="2" />
    <circle cx="310" cy="15" r="4" fill="#0d9488" stroke="#ffffff" stroke-width="2" />

    <!-- Outflow Bar Chart -->
    <rect x="40" y="60" width="12" height="30" rx="3" fill="#f59e0b" opacity="0.8" />
    <rect x="90" y="45" width="12" height="45" rx="3" fill="#f59e0b" opacity="0.8" />
    <rect x="150" y="55" width="12" height="35" rx="3" fill="#f59e0b" opacity="0.8" />
    <rect x="230" y="35" width="12" height="55" rx="3" fill="#f59e0b" opacity="0.8" />
    <rect x="280" y="40" width="12" height="50" rx="3" fill="#f59e0b" opacity="0.8" />
  </g>

  <!-- Floating Badge 1: 100% Transparent -->
  <g transform="translate(60, 180)" filter="url(#heroShadow)">
    <rect width="120" height="44" rx="22" fill="#ffffff" stroke="#10b981" stroke-width="2" />
    <circle cx="24" cy="22" r="14" fill="#ecfdf5" />
    <path d="M 18 22 L 22 26 L 30 18" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
    <text x="44" y="20" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#065f46">100% AUDITED</text>
    <text x="44" y="32" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="500" fill="#64748b">Verified Ledger</text>
  </g>

  <!-- Floating Badge 2: Real-time Donations -->
  <g transform="translate(420, 290)" filter="url(#heroShadow)">
    <rect width="140" height="46" rx="23" fill="#042f2e" stroke="#2dd4bf" stroke-width="1.5" />
    <circle cx="24" cy="23" r="14" fill="#134e4a" />
    <text x="24" y="28" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#fbbf24" text-anchor="middle">★</text>
    <text x="45" y="21" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#5eead4">UPI &amp; QR READY</text>
    <text x="45" y="34" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="500" fill="#99f6e4">Instant Tax 80G Receipt</text>
  </g>
</svg>
