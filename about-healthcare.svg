<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" rx="16" fill="url(#cardBg)" />
  <circle cx="200" cy="140" r="85" fill="#bae6fd" opacity="0.6" />
  
  <!-- Medical Cross Shield -->
  <g transform="translate(150, 60)">
    <path d="M 50 10 L 90 25 L 90 75 C 90 105 50 130 50 130 C 50 130 10 105 10 75 L 10 25 Z" fill="url(#medGrad)" />
    <!-- White Cross -->
    <rect x="42" y="40" width="16" height="50" rx="4" fill="#ffffff" />
    <rect x="25" y="57" width="50" height="16" rx="4" fill="#ffffff" />
  </g>
  
  <!-- Stethoscope / Health Pulse decoration -->
  <path d="M 40 210 L 110 210 L 130 180 L 150 240 L 170 190 L 190 220 L 210 210 L 360 210" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <circle cx="80" cy="80" r="15" fill="#38bdf8" opacity="0.5" />
  <circle cx="320" cy="90" r="22" fill="#7dd3fc" opacity="0.5" />
  <circle cx="340" cy="160" r="10" fill="#0284c7" opacity="0.3" />
</svg>
